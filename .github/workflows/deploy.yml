name: Build and Deploy to Server via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Deploy ./dist/ to Server via FTP (Auto-Reconnect & Resume)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set ftp:passive-mode true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --continue --only-newer --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob cms-data.json \
              --exclude-glob cms-store.json \
              --exclude-glob eil_site_cms_data.json \
              --exclude-glob uploads/ \
              --exclude-glob uploads/** \
              --exclude-glob .htaccess \
              --exclude-glob cgi-bin/ \
              --exclude-glob .well-known/ \
              ./dist/ ./
          "
