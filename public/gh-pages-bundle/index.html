    <script>
      // Automatic fallback when GitHub Pages serves the raw repository branch directly
      // without running Vite's build transform on index.html:
      (function () {
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        var isGitHubPages = /\.github\.io$/i.test(window.location.hostname);
        function loadPrebuiltBundle() {
          if (document.getElementById('eil-gh-pages-fallback-js')) return;
          var link = document.createElement('link');
          link.id = 'eil-gh-pages-fallback-css';
          link.rel = 'stylesheet';
          link.href = './public/gh-pages-bundle/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.id = 'eil-gh-pages-fallback-js';
          script.type = 'module';
          script.src = './public/gh-pages-bundle/app.js';
          document.body.appendChild(script);
        }
        if (rawEntry && isGitHubPages) {
          loadPrebuiltBundle();
        } else if (rawEntry) {
          rawEntry.addEventListener('error', loadPrebuiltBundle);
        }
      })();
    </script>
